<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Astro AI - Unit Tests</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/mocha/mocha.css" />
  <style>
    body { background: #0f0f12; color: #fff; }
    #mocha-stats { color: #ccc; }
    #mocha .test a.replay { color: #888; }
    #mocha h1 { display: none; }
  </style>
</head>
<body>
  <div id="mocha"></div>

  <script src="https://unpkg.com/chai/chai.js"></script>
  <script src="https://unpkg.com/mocha/mocha.js"></script>

  <script class="mocha-init">
    mocha.setup('bdd');
    mocha.checkLeaks();
  </script>

  <!-- We import our test modules here -->
  <script type="module" src="./core.test.js"></script>

  <script type="module">
    // Start the runner
    mocha.run();
  </script>
</body>
</html>
